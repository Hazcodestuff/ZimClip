[package]
name = "zimclip"
version = "0.22.6"
edition = "2021"
[dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Imaging"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
